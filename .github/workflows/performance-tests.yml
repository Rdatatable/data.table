name: atime performance tests

on:
  pull_request:
    paths:
      - 'R/**'
      - 'src/**'
      - '.ci/atime/**'
      - '.github/workflows/performance-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.pull_request.head.repo.full_name == 'Rdatatable/data.table'
    runs-on: ubuntu-latest
    steps:
      - name: Start timer
        shell: bash
        run: echo "START_SETUP_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Retrieve branch references, necessary for perf testing past versions
        shell: bash
        run: |
          git switch "${GITHUB_BASE_REF}"
          git switch "${GITHUB_HEAD_REF}"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: ${{ hashFiles('.ci/atime/tests.R') }}
          extra-packages: cran::data.table, any::atime, any::ggplot2, any::directlabels

      - name: Adjust compilation flags for old data.table versions
        shell: bash
        run: sudo sed -i 's|-Werror=format-security||' "$(Rscript -e 'cat(R.home("etc"))')/Makeconf"

      - name: Run atime
        shell: bash
        run: |
          echo "END_SETUP_START_TESTS_TIME=$(date +%s)" >> "$GITHUB_ENV"
          Rscript -e 'atime::atime_pkg(Sys.getenv("GITHUB_WORKSPACE"), tests.dir = ".ci")'
          echo "END_TESTS_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Upload artifact
        id: artifact-upload-step
        uses: actions/upload-artifact@v7
        with:
          name: atime-results
          path: .ci/atime/

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        shell: bash
        run: |
          uploadImage() {
            curl --fail --retry 3 -sS -F "file=@$1" -F "visibility=unlisted" https://picrd.com/api/upload | jq -r '.image_url'
          }
          PREVIEW_URL=$(uploadImage .ci/atime/tests_preview_facet.png)
          ALL_URL=$(uploadImage .ci/atime/tests_all_facet.png)

          R_SETUP_DURATION=$((END_SETUP_START_TESTS_TIME - START_SETUP_TIME))
          VERSION_SETUP_DURATION=$(cut -d '.' -f 1 ./.ci/atime/install_seconds.txt)
          ATIME_TESTS_DURATION=$((END_TESTS_TIME - END_SETUP_START_TESTS_TIME - VERSION_SETUP_DURATION))
          formatTime() {
            local totalSeconds=$1
            if [ "$totalSeconds" -lt 0 ]; then
              echo "Time calculation error: negative duration"
            elif [ "$totalSeconds" -lt 60 ]; then
              echo "${totalSeconds} seconds"
            else
              echo "$((totalSeconds / 60)) minutes and $((totalSeconds % 60)) seconds"
            fi
          }

          ARTIFACT_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.artifact-upload-step.outputs.artifact-id }}"
          cat <<EOF > comment.md
          <!-- automatic comment for atime -->
          $(cat .ci/atime/HEAD_issues.md)

          [![Comparison Plot]($PREVIEW_URL)]($ALL_URL)

          Generated via commit ${{ github.event.pull_request.head.sha }}

          Download link for the artifact containing the test results: [↓ atime-results.zip]($ARTIFACT_URL)

          | Task | Duration |
          |---|---|
          | R setup and installing dependencies | $(formatTime "$R_SETUP_DURATION") |
          | Installing different package versions | $(formatTime "$VERSION_SETUP_DURATION") |
          | Running and plotting the test cases | $(formatTime "$ATIME_TESTS_DURATION") |
          EOF

          COMMENT_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- automatic comment for atime -->")) | .id' | head -n 1)
          if [ -z "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -F body=@comment.md
          fi
