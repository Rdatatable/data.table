name: Fuzz base image

# Optional workflow to build and publish a self-hosted instrumented R base
# image (ghcr.io/<owner>/data.table/r-base:address) from R SVN trunk.
# By default, .clusterfuzzlite/Dockerfile consumes the public
# ghcr.io/r-devel/r-oss-fuzz/r-base:address image directly.
#
# Modeled on https://github.com/r-devel/r-oss-fuzz/blob/main/.github/workflows/base-image.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.clusterfuzzlite/docker/base/**'
      - '.github/workflows/base-image.yml'

permissions: read-all

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fuzz-base-image-pr-{0}', github.event.pull_request.number) || 'fuzz-base-image' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .clusterfuzzlite/docker/base/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}/r-base:address
