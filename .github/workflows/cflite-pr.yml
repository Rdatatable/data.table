name: ClusterFuzzLite PR

# Fuzzes pull requests that touch C/R source or the fuzzing harnesses:
# builds data.table and the harnesses against the prebuilt instrumented R base
# image and runs coverage-guided fuzzing on affected targets.
#
# Modeled on https://github.com/r-devel/r-oss-fuzz/blob/main/.github/workflows/cflite-pr.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'R/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite-pr.yml'

permissions: read-all

concurrency:
  group: cflite-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  PR:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        env:
          REPORT_TIMEOUTS: false
          REPORT_OOMS: false
        with:
          language: c
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'code-change'
          output-sarif: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.build.outcome == 'success'
        with:
          sarif_file: cifuzz-sarif/results.sarif
          checkout_path: cifuzz-sarif
